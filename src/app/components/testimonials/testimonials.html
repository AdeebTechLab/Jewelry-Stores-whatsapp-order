<section class="testimonials-section"><p class="eyebrow">Notes from our customers</p><h2>Loved by the women who wear it</h2><div class="testimonial-grid">@for (testimonial of store.testimonials; track testimonial.name) {<article><div class="stars"><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i></div><blockquote>“{{ testimonial.quote }}”</blockquote><div class="reviewer"><img [src]="testimonial.profile" [alt]="testimonial.name" loading="lazy" /><div><strong>{{ testimonial.name }}</strong><small><i class="bi bi-patch-check-fill"></i> {{ testimonial.detail }}</small></div></div></article>}</div></section>
