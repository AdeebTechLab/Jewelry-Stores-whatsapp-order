<main class="auth-page"><section class="brand-panel"><a class="brand" routerLink="/" aria-label="Danish&Co home"><span class="brand-mark">D&Co</span><span>Danish&amp;Co</span></a><div class="brand-copy"><p class="eyebrow">A fresh start</p><h1>Come back to<br /><em>your favourites.</em></h1></div></section><section class="form-panel"><div class="form-wrap"><p class="eyebrow">Forgot password</p><h2>Reset your password</h2><p class="subheading">Enter your Gmail and we will show the next step.</p>@if (!submitted) {<form (ngSubmit)="submit()"><label for="email">Gmail address</label><input id="email" name="email" type="email" [(ngModel)]="email" required placeholder="you@gmail.com" /><button class="primary-button" type="submit">Continue <span>→</span></button></form>} @else {<p class="form-error">Reset instructions are ready for {{ email }}. This frontend demo does not send email.</p>}<p class="switch-text"><a routerLink="/login">Back to sign in</a></p></div></section></main>
