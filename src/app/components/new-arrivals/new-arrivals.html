<section class="arrivals-section" id="new-arrivals"><div class="section-heading"><div><p class="eyebrow">Just landed</p><h2>New arrivals</h2><p class="section-caption">Fresh silhouettes, made for your everyday rotation.</p></div><div class="slider-controls"><button type="button" (click)="store.previousArrival()" aria-label="Previous new arrivals"><i class="bi bi-arrow-left"></i></button><button type="button" (click)="store.nextArrival()" aria-label="Next new arrivals"><i class="bi bi-arrow-right"></i></button></div></div><div class="arrival-slider">@for (product of store.arrivalCarousel(); track product.name) {<a class="arrival-card" [routerLink]="['/product', product.name]"><div class="arrival-image"><img [src]="product.image" [alt]="product.name" loading="lazy" /><span>{{ product.tag }}</span></div><div class="arrival-info"><strong>{{ product.name }}</strong><small>{{ product.category }} · ${{ product.price }}</small></div><i class="bi bi-arrow-up-right"></i></a>}</div></section>
