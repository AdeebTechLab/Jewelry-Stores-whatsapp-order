<section class="newsletter-section"><div><p class="eyebrow">Stay in the know</p><h2>{{ store.newsletterTitle }}</h2><p>New pieces, private previews, and notes from the Danish&amp;Co studio.</p></div><form (ngSubmit)="subscribe()"><label for="newsletter-email">Your email address</label><div class="newsletter-input"><input id="newsletter-email" name="email" type="email" [(ngModel)]="email" required placeholder="you@example.com" /><button type="submit" aria-label="Subscribe"><i class="bi bi-arrow-right"></i></button></div>@if (subscribed) {<small class="success-message">Thank you. You are on the list.</small>}</form></section>
