<main class="admin-page"><a class="back-link" routerLink="/admin/products"><i class="bi bi-arrow-left"></i> Admin products</a><div class="admin-heading"><div><p class="eyebrow">Danish&amp;Co studio</p><h1>Settings</h1><p>Manage where new checkout orders are received.</p></div></div><section class="settings-panel"><form (ngSubmit)="save()"><h2>WhatsApp orders</h2><p>Customers will be sent to this WhatsApp number after placing an order.</p><label for="whatsapp">Admin WhatsApp number</label><input id="whatsapp" name="whatsapp" [(ngModel)]="whatsapp" required inputmode="tel" placeholder="923045865559" /><small>Use country code without + or spaces.</small><button class="commerce-button" type="submit"><i class="bi bi-whatsapp"></i> Save number</button>@if (saved) {<strong class="save-message"><i class="bi bi-check2"></i> WhatsApp number saved</strong>}</form></section></main>
