<main class="admin-page"><a class="back-link" routerLink="/admin/products"><i class="bi bi-arrow-left"></i> Products</a><div class="admin-form-shell"><p class="eyebrow">Collection management</p><h1>Edit product</h1><form (ngSubmit)="save()"><label for="name">Product name</label><input id="name" name="name" [(ngModel)]="product.name" required /><label for="category">Category</label><select id="category" name="category" [(ngModel)]="product.category"><option>Rings</option><option>Necklaces</option><option>Earrings</option><option>Bracelets</option></select><label for="price">Price</label><input id="price" name="price" type="number" min="1" [(ngModel)]="product.price" required /><label for="description">Description</label><textarea id="description" name="description" [(ngModel)]="product.description" required></textarea><label for="sizes">Sizes</label><input id="sizes" name="sizes" [ngModel]="product.sizes.join(', ')" (ngModelChange)="setSizes($event)" /><label for="stock">Available stock</label><input id="stock" name="stock" type="number" min="0" [(ngModel)]="product.stock" required /><label for="tag">Label</label><select id="tag" name="tag" [(ngModel)]="product.tag"><option>New</option><option>Bestseller</option><option>Limited</option></select><label for="image">Image URL</label><input id="image" name="image" [(ngModel)]="product.image" required /><label class="home-toggle"><input type="checkbox" name="showHome" [(ngModel)]="product.showHome" /><span>Show on home page</span><small>Only the first 8 enabled products appear on the home page.</small></label><button class="commerce-button" type="submit">Save changes <i class="bi bi-check2"></i></button></form></div></main>
