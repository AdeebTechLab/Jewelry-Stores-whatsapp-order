<main class="admin-page"><div class="admin-heading"><div><p class="eyebrow">Danish&amp;Co studio</p><h1>Products</h1><p>Manage the collection shown on your storefront.</p></div><a class="commerce-button" routerLink="/admin/products/add"><i class="bi bi-plus-lg"></i> Add product</a></div><section class="admin-product-grid">@for (product of store.products(); track product.name) {<article class="admin-product-card"><img [src]="product.image" [alt]="product.name" /><div><span>{{ product.tag }}</span><h2>{{ product.name }}</h2><p>{{ product.category }} · ${{ product.price }}</p><div><a [routerLink]="['/admin/products/edit', product.name]">Edit</a><button type="button" (click)="remove(product.name)">Delete</button></div></div></article>}</section></main>
