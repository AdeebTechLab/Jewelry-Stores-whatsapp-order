<router-outlet></router-outlet>
@if (store.notification(); as notice) {
	<div class="store-notification" [class]="'store-notification ' + notice.tone" role="status"><i class="bi" [class.bi-check-circle]="notice.tone === 'success'" [class.bi-trash3]="notice.tone === 'danger'" [class.bi-info-circle]="notice.tone === 'warning'"></i><span>{{ notice.message }}</span></div>
}
